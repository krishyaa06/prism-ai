services:
  prism-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      PRISM_MODEL_ENDPOINT: ${PRISM_MODEL_ENDPOINT:?Set PRISM_MODEL_ENDPOINT}
      PRISM_MODEL_NAME: ${PRISM_MODEL_NAME:-prism}
      PRISM_MODEL_API_KEY: ${PRISM_MODEL_API_KEY:-}
      PRISM_MODEL_PLANNER_ENDPOINT: ${PRISM_MODEL_PLANNER_ENDPOINT:-}
      PRISM_MODEL_EXECUTOR_ENDPOINT: ${PRISM_MODEL_EXECUTOR_ENDPOINT:-}
      PRISM_MODEL_RESEARCH_ENDPOINT: ${PRISM_MODEL_RESEARCH_ENDPOINT:-}
      PRISM_MODEL_REVIEW_ENDPOINT: ${PRISM_MODEL_REVIEW_ENDPOINT:-}
      PRISM_MODEL_PLANNER_NAME: ${PRISM_MODEL_PLANNER_NAME:-}
      PRISM_MODEL_EXECUTOR_NAME: ${PRISM_MODEL_EXECUTOR_NAME:-}
      PRISM_MODEL_RESEARCH_NAME: ${PRISM_MODEL_RESEARCH_NAME:-}
      PRISM_MODEL_REVIEW_NAME: ${PRISM_MODEL_REVIEW_NAME:-}
      PRISM_MODEL_PLANNER_API_KEY: ${PRISM_MODEL_PLANNER_API_KEY:-}
      PRISM_MODEL_EXECUTOR_API_KEY: ${PRISM_MODEL_EXECUTOR_API_KEY:-}
      PRISM_MODEL_RESEARCH_API_KEY: ${PRISM_MODEL_RESEARCH_API_KEY:-}
      PRISM_MODEL_REVIEW_API_KEY: ${PRISM_MODEL_REVIEW_API_KEY:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
